# Exact upstream v0.4.12 voltage points, capped at 1500 MHz.
# This is an upstream profile, not a claim of board-specific voltage validation.
[timing.intervals]
sample = 250
adjust = 100000

[gpu-usage]
fix-metrics = false
fix-freq = false
method = "busy-flag"
flush-every = 10

[gpu]
set-method = "smu"

[dbus]
enabled = false

[frequency-range]
min = 1000
max = 1500

[timing.ramp-rates]
normal = 1
burst = 50

[timing]
burst-samples = 60
down-events = 5

[frequency-thresholds]
adjust = 10

[load-target]
upper = 0.65
lower = 0.50

[temperature]
throttling = 85
throttling_recovery = 75

[[safe-points]]
frequency = 500
voltage = 700

[[safe-points]]
frequency = 1000
voltage = 800

[[safe-points]]
frequency = 1175
voltage = 850

[[safe-points]]
frequency = 1500
voltage = 900
