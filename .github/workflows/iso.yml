name: Generate ISO

on:
  workflow_run:
    workflows: ["Build Naia OS image"]
    types: [completed]
  workflow_dispatch:

env:
  IMAGE_NAME: naia-os
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  R2_PUBLIC: https://pub-affd0538517845d98ce44a5aec11dd98.r2.dev
  R2_BUCKET: s3://naia-releases
  ISO_KEY: naia-os-live-amd64.iso

jobs:
  build-iso:
    name: Generate ISO
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: write
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the Naia OS version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < config/files/usr/share/naia/naia-os-version)"
          test -n "$VERSION" || { echo "::error::naia-os-version is empty"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      # Resolve `latest` to a digest once, here, and build against that digest
      # for the rest of the job. Passing the tag to titanoboa would let a
      # scheduled or manual image build move `latest` between this job starting
      # and titanoboa pulling, so the ISO would ship an image that never passed
      # a smoke test while the workflow history claims otherwise.
      - name: Pin the image digest
        id: image
        run: |
          set -euo pipefail
          REF="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${REF}:latest")"
          test -n "$DIGEST" || { echo "::error::could not resolve ${REF}:latest"; exit 1; }
          echo "ref=${REF}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Building an ISO around ${REF}@${DIGEST}"

      # The post-rootfs hook reads its branding assets from inside the image and
      # assumes the layered shell is there. Prove both against the pinned digest
      # before spending ~40 minutes wrapping an ISO around it.
      - name: Verify the pinned image
        run: |
          set -euo pipefail
          podman run --rm --entrypoint /bin/bash \
            "${{ steps.image.outputs.ref }}" \
            /usr/libexec/naia-verify-image

      - name: Build ISO
        id: build
        uses: nextain/titanoboa@main
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          hook-post-rootfs: ${{ github.workspace }}/installer/hook-post-rootfs.sh
          flatpaks-list: ${{ github.workspace }}/installer/flatpaks
          iso-dest: ${{ github.workspace }}/naia-os-live-amd64.iso
          compression: squashfs

      - name: Generate Checksum
        id: checksum
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          ls -lh "$ISO_PATH"
          # An ISO that builds but is far too small means the rootfs did not
          # take. The last shipped image was 7.8GB; anything under 3GB is a
          # structural failure wearing a success exit code.
          BYTES="$(stat -c %s "$ISO_PATH")"
          test "$BYTES" -gt 3000000000 || {
            echo "::error::ISO is implausibly small ($BYTES bytes)"
            exit 1
          }
          sha256sum "$ISO_PATH" > "${ISO_PATH}-CHECKSUM"
          cat "${ISO_PATH}-CHECKSUM"
          echo "sha256=$(awk '{print $1}' < "${ISO_PATH}-CHECKSUM")" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: naia-os-live
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          retention-days: 30
          if-no-files-found: error

      # Publishing to R2 means overwriting two objects that cannot be swapped
      # atomically: the ISO and its checksum. Three things follow.
      #
      # Backups are timestamped, never a single `previous/` that a later run can
      # overwrite. The old pipeline copied into a fixed `previous/` with
      # `|| true`, so a run that published a broken pair could then overwrite the
      # last good backup with it — and in fact `previous/` is empty today, which
      # means those copies were failing silently all along.
      #
      # `previous/` is still written, because release notes point at it, but only
      # after the timestamped copy exists.
      #
      # And the publish is verified against the served bytes afterwards; if that
      # fails, the timestamped backup is restored before the job goes red.
      - name: Publish to Cloudflare R2
        id: publish
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          BACKUP="${R2_BUCKET}/previous/${{ steps.version.outputs.stamp }}"

          if aws s3 ls "${R2_BUCKET}/${ISO_KEY}" >/dev/null 2>&1; then
            echo "Backing up the currently served pair to ${BACKUP}/"
            aws s3 cp "${R2_BUCKET}/${ISO_KEY}" "${BACKUP}/${ISO_KEY}" --no-progress
            aws s3 cp "${R2_BUCKET}/${ISO_KEY}-CHECKSUM" "${BACKUP}/${ISO_KEY}-CHECKSUM" --no-progress
            aws s3 cp "${BACKUP}/${ISO_KEY}" "${R2_BUCKET}/previous/${ISO_KEY}" --no-progress
            aws s3 cp "${BACKUP}/${ISO_KEY}-CHECKSUM" "${R2_BUCKET}/previous/${ISO_KEY}-CHECKSUM" --no-progress
            echo "backup=${BACKUP}" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing published yet — no backup to take."
            echo "backup=" >> "$GITHUB_OUTPUT"
          fi

          aws s3 cp "$ISO_PATH" "${R2_BUCKET}/${ISO_KEY}" --no-progress
          aws s3 cp "${ISO_PATH}-CHECKSUM" "${R2_BUCKET}/${ISO_KEY}-CHECKSUM" --no-progress

      # The published bytes are what users get; the runner's copy is not
      # evidence. A cache-busting query keeps the CDN from answering with the
      # object this step is supposed to be checking.
      - name: Verify the published ISO
        id: verify
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          BUST="?v=${{ steps.version.outputs.stamp }}"
          curl -sfL "${R2_PUBLIC}/${ISO_KEY}-CHECKSUM${BUST}" -o served-CHECKSUM
          SERVED_SUM="$(awk '{print $1}' < served-CHECKSUM)"
          SERVED_SIZE="$(curl -sIL "${R2_PUBLIC}/${ISO_KEY}${BUST}" | grep -i '^content-length:' | tail -1 | tr -dc '0-9')"
          echo "built  sha256=${{ steps.checksum.outputs.sha256 }} bytes=${{ steps.checksum.outputs.bytes }}"
          echo "served sha256=${SERVED_SUM} bytes=${SERVED_SIZE}"
          test "$SERVED_SUM" = "${{ steps.checksum.outputs.sha256 }}" \
            || { echo "::error::Served checksum does not match the ISO just built"; exit 1; }
          test "$SERVED_SIZE" = "${{ steps.checksum.outputs.bytes }}" \
            || { echo "::error::Served ISO size does not match the ISO just built"; exit 1; }

      # A failed publish must not leave users on a mismatched ISO/checksum pair.
      - name: Roll back a failed publish
        if: failure() && steps.publish.outcome == 'success' && steps.publish.outputs.backup != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          set -euo pipefail
          BACKUP="${{ steps.publish.outputs.backup }}"
          echo "::warning::Restoring the previously served ISO from ${BACKUP}"
          aws s3 cp "${BACKUP}/${ISO_KEY}" "${R2_BUCKET}/${ISO_KEY}" --no-progress
          aws s3 cp "${BACKUP}/${ISO_KEY}-CHECKSUM" "${R2_BUCKET}/${ISO_KEY}-CHECKSUM" --no-progress
          echo "::warning::Rolled back. The public ISO is the previous build."

      - name: Draft the ISO release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ steps.version.outputs.version }}.${{ steps.version.outputs.date }}.${{ github.run_number }}
          name: "Naia OS ${{ steps.version.outputs.version }} (Build #${{ github.run_number }}, ${{ steps.version.outputs.date }})"
          body: |
            Naia OS ${{ steps.version.outputs.version }} live ISO.

            Image: `${{ steps.image.outputs.ref }}`

            ISO: ${{ env.R2_PUBLIC }}/${{ env.ISO_KEY }}
            Checksum: ${{ env.R2_PUBLIC }}/${{ env.ISO_KEY }}-CHECKSUM

            The pair this build replaced is kept at
            `previous/${{ steps.version.outputs.stamp }}/`, and the most recent
            one is also mirrored at `previous/`.

            **Not verified booted.** The image passed its assertions and the
            published bytes match the build. Nobody has started this ISO on
            hardware. Boot it, and confirm the Naia window is actually visible
            and not a 1x1 stub, before announcing it.
          files: ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          draft: true
