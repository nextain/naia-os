name: Generate ISO

on:
  workflow_run:
    workflows: ["Build Naia OS image"]
    types: [completed]
  workflow_dispatch:

env:
  IMAGE_NAME: naia-os
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-iso:
    name: Generate ISO
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: write
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the Naia OS version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < config/files/usr/share/naia/naia-os-version)"
          test -n "$VERSION" || { echo "::error::naia-os-version is empty"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # The post-rootfs hook reads its branding assets from inside the image and
      # asserts the layered shell is present. Prove the image satisfies both
      # before spending ~40 minutes building an ISO around it.
      - name: Verify the source image before building an ISO around it
        run: |
          set -euo pipefail
          podman run --rm --entrypoint /bin/bash \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:latest" \
            /usr/libexec/naia-verify-image

      - name: Build ISO
        id: build
        uses: nextain/titanoboa@main
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          hook-post-rootfs: ${{ github.workspace }}/installer/hook-post-rootfs.sh
          flatpaks-list: ${{ github.workspace }}/installer/flatpaks
          iso-dest: ${{ github.workspace }}/naia-os-live-amd64.iso
          compression: squashfs

      - name: Generate Checksum
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          ls -lh "$ISO_PATH"
          # An ISO that builds but is far too small means the rootfs did not
          # take. The last shipped image was 7.8GB; anything under 3GB is a
          # structural failure wearing a success exit code.
          BYTES="$(stat -c %s "$ISO_PATH")"
          test "$BYTES" -gt 3000000000 || {
            echo "::error::ISO is implausibly small ($BYTES bytes)"
            exit 1
          }
          sha256sum "$ISO_PATH" > "${ISO_PATH}-CHECKSUM"
          cat "${ISO_PATH}-CHECKSUM"

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: naia-os-live
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          retention-days: 30
          if-no-files-found: error

      - name: Upload ISO to Cloudflare R2
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          # Back up the currently served ISO before overwriting it. This is the
          # only rollback path for people downloading from the public URL, so a
          # failed backup must stop the upload rather than be swallowed.
          aws s3 cp s3://naia-releases/naia-os-live-amd64.iso \
                    s3://naia-releases/previous/naia-os-live-amd64.iso --no-progress
          aws s3 cp s3://naia-releases/naia-os-live-amd64.iso-CHECKSUM \
                    s3://naia-releases/previous/naia-os-live-amd64.iso-CHECKSUM --no-progress
          aws s3 cp "$ISO_PATH" s3://naia-releases/naia-os-live-amd64.iso --no-progress
          aws s3 cp "${ISO_PATH}-CHECKSUM" s3://naia-releases/naia-os-live-amd64.iso-CHECKSUM --no-progress

      # The published bytes are what users get; the runner's copy is not
      # evidence. Compare the served checksum against what was just built.
      - name: Verify the published ISO
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          BASE="https://pub-affd0538517845d98ce44a5aec11dd98.r2.dev"
          curl -sfL "${BASE}/naia-os-live-amd64.iso-CHECKSUM" -o served-CHECKSUM
          BUILT="$(awk '{print $1}' < "${{ steps.build.outputs.iso-dest }}-CHECKSUM")"
          SERVED="$(awk '{print $1}' < served-CHECKSUM)"
          echo "built:  $BUILT"
          echo "served: $SERVED"
          test "$BUILT" = "$SERVED" || {
            echo "::error::Published checksum does not match the ISO that was just built"
            exit 1
          }
          SIZE="$(curl -sIL "${BASE}/naia-os-live-amd64.iso" | grep -i '^content-length:' | tail -1 | tr -dc '0-9')"
          echo "served size: $SIZE"
          test "$SIZE" = "$(stat -c %s "${{ steps.build.outputs.iso-dest }}")" || {
            echo "::error::Published ISO size does not match the built ISO"
            exit 1
          }

      - name: Draft the ISO release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ steps.version.outputs.version }}.${{ steps.version.outputs.date }}.${{ github.run_number }}
          name: "Naia OS ${{ steps.version.outputs.version }} (Build #${{ github.run_number }}, ${{ steps.version.outputs.date }})"
          body: |
            Naia OS ${{ steps.version.outputs.version }} live ISO.

            ISO: https://pub-affd0538517845d98ce44a5aec11dd98.r2.dev/naia-os-live-amd64.iso
            Checksum: https://pub-affd0538517845d98ce44a5aec11dd98.r2.dev/naia-os-live-amd64.iso-CHECKSUM

            The previous ISO stays reachable under `previous/` on the same host
            until the next build overwrites it.

            This ISO has been built and its published bytes verified against the
            build. It has not been booted. Boot it before announcing it.
          files: ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          draft: true
